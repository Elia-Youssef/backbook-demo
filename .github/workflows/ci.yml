name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure, build, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (
            & $vswhere `
              -latest `
              -products "*" `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath |
              Select-Object -First 1
          )
          if (-not $vsPath) {
            throw "MSVC toolchain not found."
          }

          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch amd64 `
            -HostArch amd64 `
            -SkipAutomaticLocation
          Set-Location $env:GITHUB_WORKSPACE

          where.exe cl.exe
          cmake --preset msvc-debug
          cmake --build --preset msvc-debug --parallel
          ctest --preset msvc-debug --output-on-failure --timeout 30

  linux-gcc:
    name: Linux / GCC 13
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure, build, and test
        shell: bash
        run: |
          set -euo pipefail
          tool_bin="$RUNNER_TEMP/gcc-13-bin"
          mkdir -p "$tool_bin"
          ln -s "$(command -v g++-13)" "$tool_bin/g++"
          export PATH="$tool_bin:$PATH"

          test "$(g++ -dumpfullversion -dumpversion | cut -d. -f1)" = "13"
          cmake --preset gcc-debug
          cmake --build --preset gcc-debug --parallel
          ctest --preset gcc-debug --output-on-failure --timeout 30

  linux-clang-sanitizers:
    name: Ubuntu / Clang 18 / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            clang-18 \
            libclang-rt-18-dev \
            llvm-18

      - name: Configure, build, and test
        shell: bash
        run: |
          set -euo pipefail
          test "$(clang++-18 -dumpversion | cut -d. -f1)" = "18"
          export ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer-18)"

          cmake --preset clang-sanitizers
          cmake --build --preset clang-sanitizers --parallel
          ctest \
            --preset clang-sanitizers \
            --output-on-failure \
            --timeout 30

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, and build
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- dist

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - windows-msvc
      - linux-gcc
      - linux-clang-sanitizers
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful compiler jobs
        shell: bash
        env:
          WINDOWS_RESULT: ${{ needs.windows-msvc.result }}
          LINUX_RESULT: ${{ needs.linux-gcc.result }}
          CLANG_SANITIZERS_RESULT: ${{ needs.linux-clang-sanitizers.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          test "$WINDOWS_RESULT" = "success"
          test "$LINUX_RESULT" = "success"
          test "$CLANG_SANITIZERS_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
